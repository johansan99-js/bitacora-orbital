# Publica la Bitácora Orbital en GitHub Pages cada vez que hay cambios en main, solo si pasan las pruebas.
# Requiere Settings → Pages → Source: "GitHub Actions".
name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Una sola publicación a la vez; no cancela la que ya está en curso.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # La misma suite que corre en cada PR (pruebas.yml); si falla, publicar no corre.
  pruebas:
    uses: ./.github/workflows/pruebas.yml

  publicar:
    needs: pruebas
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      # Solo lo que necesita la página: la app, las texturas, los retratos, la simulación de población y three.js.
      # Los <script> locales llevan ?v=dev; aquí pasa a ser el commit, así la caché del navegador (Pages da max-age=600)
      # nunca mezcla un index.html nuevo con un script viejo. Falla si algún script quedó sin versión.
      - name: Preparar el sitio
        run: |
          mkdir _site
          cp -r index.html tex renders poblacion vendor _site/
          version="${GITHUB_SHA::8}"
          sed -i -E "s#(src=\"(poblacion|vendor)/[^\"?]+\.js)\?v=dev\"#\1?v=${version}\"#g" _site/index.html
          if grep -nE 'src="(poblacion|vendor)/[^"]+\.js(\?v=dev)?"' _site/index.html; then
            echo "Hay scripts locales sin la versión del commit" >&2; exit 1
          fi
          grep -c "?v=${version}\"" _site/index.html

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
