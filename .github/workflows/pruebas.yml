# Corre la suite completa (con las huellas de Historia y de Tu pueblo) en cada PR y en cada push a main.
# pages.yml la llama antes de publicar: si una prueba falla, no se publica.
# Sin criterios de tiempo de reloj: en un runner compartido darían rojos falsos.
name: Pruebas

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: node --test
        run: node --test "pruebas/*.test.mjs"
